<!DOCTYPE html>
<html>
<head>
<style>
.image-frame {
  position: relative;
  width: 400px;
  height: 400px;
  overflow: hidden;
  background-color: black; /* fallback background */
}

.image-frame::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('workplace.jpg');
  background-size: 120% auto;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.3;
  filter: blur(3px);
  z-index: 0;
  pointer-events: none;
}

.main-img {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 400px;
  height: 300px;
  transform: translate(-50%, -50%);
  z-index: 2;
  
  /* Fade top and bottom using mask */
  mask-image: linear-gradient(to bottom, transparent 0px, black 10px, black calc(100% - 16px), transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 10px, black calc(100% - 16px), transparent 100%);
}

.main-img {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 400px;
  height: 300px;
  transform: translate(-50%, -50%);
  z-index: 2;
}

/* Top and bottom blend zones */
.blend-zone {
  position: absolute;
  width: 100%;
  height: 10px; /* changed from 50px */
  background-image: url('workplace.jpg');
  background-size: 120% auto;
  background-position: center;
  background-repeat: no-repeat;
  opacity: 0.4;
  filter: blur(6px); /* slightly reduced for subtlety */
  z-index: 1;
  pointer-events: none;
}

.blend-zone.top {
  top: 0;
  mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, black 0%, transparent 100%);
}

.blend-zone.bottom {
  bottom: 0;
  mask-image: linear-gradient(to top, black 0%, transparent 100%);
  -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
}

</style>
</head>
<body>
<div class="image-frame" id="image-frame">
  <img src="workplace.jpg" alt="Main image" class="main-img" id="main-img">

  <div class="blend-zone top"></div>
  <div class="blend-zone bottom"></div>
</div>


<script>
  const img = document.getElementById('main-img');
  const frame = document.getElementById('image-frame');

  img.onload = function () {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imageData.data;

    let r = 0, g = 0, b = 0, count = 0;

    // Sample pixels every 10th pixel (faster)
    for (let i = 0; i < data.length; i += 40) {
      r += data[i];
      g += data[i + 1];
      b += data[i + 2];
      count++;
    }

    r = Math.round(r / count);
    g = Math.round(g / count);
    b = Math.round(b / count);

    const avgColor = `rgb(${r}, ${g}, ${b})`;
    frame.style.backgroundColor = avgColor;
  };
</script>

</body>
</html>
